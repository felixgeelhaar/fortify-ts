# Thin caller for the shared klarlabs-studio JS/TS CI bar.
name: CI

on:
  push:
    branches: [main]
    paths-ignore: ["**.md", "docs/**", "LICENSE"]
  # No paths-ignore on pull_request. These contexts are required by branch
  # protection, and a skipped workflow does not report a skipped check — it
  # reports nothing, so the PR waits forever on a check that will never arrive
  # and can only be admin-merged. mnemos hit exactly this: changelog PRs stayed
  # BLOCKED because a paths-ignore meant the required contexts never ran.
  #
  # Running the bar on a docs-only PR is cheap — nothing it compiles changed, so
  # it is a cache hit. push-to-main above still skips docs, where nothing is
  # gating.
  pull_request:
    branches: [main]

  # Re-run the bar on demand. Without this the only way to retest main is to
  # push a commit — which is how a shared-workflow startup_failure went
  # unnoticed here, with no way to confirm a fix in place.
  workflow_dispatch:
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  ci:
    uses: klarlabs-studio/.github/.github/workflows/js-ci.yml@main
    permissions:
      contents: read
      security-events: write
      pull-requests: write
    secrets: inherit
    with:
      package-manager: pnpm
